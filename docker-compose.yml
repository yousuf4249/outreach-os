name: weblinx-outreach-os

version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weblinx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weblinx_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-weblinx_outreach}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weblinx} -d ${POSTGRES_DB:-weblinx_outreach}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: weblinx-outreach-os:latest
    restart: unless-stopped
    expose:
      - "8000"  # internal only; Caddy reverse-proxies to this
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Automatically points to the postgres container
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-weblinx}:${POSTGRES_PASSWORD:-weblinx_secure_pass_2026}@db:5432/${POSTGRES_DB:-weblinx_outreach}"
      # Enable local disk backups
      QUICKLY_LOCAL_DISK_BACKUPS: "1"
    volumes:
      - ./backups:/app/backups

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    env_file: .env
    depends_on:
      - app

volumes:
  pgdata:
    name: weblinx_outreach_pgdata
