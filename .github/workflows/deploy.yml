name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
      - weblinx-main
  workflow_dispatch:

jobs:
  deploy:
    name: Automatic Deployment via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          passphrase: ${{ secrets.HOSTINGER_SSH_PASSPHRASE || '' }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script: |
            set -e
            APP_DIR="/opt/weblinx-outreach"
            
            # If repo doesn't exist, clone it
            if [ ! -d "$APP_DIR" ]; then
              echo "[*] Cloning repository to $APP_DIR..."
              sudo mkdir -p "$APP_DIR"
              sudo chown -R $USER:$USER "$APP_DIR"
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "[*] Pulling latest changes from Git..."
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            echo "[*] Running deploy script..."
            chmod +x scripts/*.sh
            ./scripts/deploy.sh

            echo "[✓] Deployment successful!"
